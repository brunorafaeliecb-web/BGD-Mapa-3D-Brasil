<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BGD — Mapa 3D do Brasil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Roboto', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    overflow: hidden;
    height: 100vh;
  }
  body.light {
    background: #f8fafc;
    color: #0f172a;
  }
  #container { width: 100vw; height: 100vh; }
  #ui {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  button, .btn {
    background: #1e293b;
    color: #e2e8f0;
    border: none;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  body.light button, body.light .btn {
    background: #e2e8f0;
    color: #0f172a;
  }
  #lock {
    position: absolute;
    bottom: 20px;
    right: 20px;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
  }
  #buttons {
    position: absolute;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
    background: rgba(15, 23, 42, 0.9);
    padding: 12px;
    border-radius: 12px;
  }
  body.light #buttons {
    background: rgba(248, 250, 252, 0.95);
  }
  #sun {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,100,0.4) 0%, transparent 70%);
    pointer-events: none;
    z-index: 5;
    transform: translate(-50%, -50%);
  }
  #admin {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1e293b;
    padding: 24px;
    border-radius: 16px;
    z-index: 30;
    min-width: 320px;
  }
  body.light #admin { background: #fff; color: #0f172a; }
  #admin input {
    width: 100%;
    padding: 8px;
    margin: 6px 0 12px;
    border-radius: 8px;
    border: 1px solid #475569;
  }
  .state-label {
    position: absolute;
    color: white;
    font-size: 11px;
    font-weight: 600;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div id="container"></div>
<div id="sun"></div>

<div id="ui">
  <button id="darkBtn">Dark / Light</button>
</div>

<div id="lock" title="Admin">🔒</div>

<div id="buttons">
  <button class="btn" data-key="saude">Planos de Saúde</button>
  <button class="btn" data-key="eletronica">Segurança Eletrônica</button>
  <button class="btn" data-key="ti">Segurança da Informação / TI / Automações<br><small>IA</small></button>
</div>

<div id="admin">
  <h3>Painel Admin — Links</h3>
  <label>Planos de Saúde</label>
  <input id="link-saude" placeholder="https://...">
  <label>Segurança Eletrônica</label>
  <input id="link-eletronica" placeholder="https://...">
  <label>TI / Automações / IA</label>
  <input id="link-ti" placeholder="https://...">
  <button id="saveLinks">Salvar</button>
  <button id="closeAdmin" style="margin-left:8px">Fechar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const links = JSON.parse(localStorage.getItem('bgd-links') || '{}');

const stateColors = {
  AC: 0x22c55e, AL: 0x3b82f6, AP: 0x10b981, AM: 0x059669,
  BA: 0xf59e0b, CE: 0xef4444, DF: 0x8b5cf6, ES: 0x06b6d4,
  GO: 0x84cc16, MA: 0xf97316, MT: 0x65a30d, MS: 0x16a34a,
  MG: 0xeab308, PA: 0x15803d, PB: 0xdc2626, PR: 0x2563eb,
  PE: 0xea580c, PI: 0xfacc15, RJ: 0x1d4ed8, RN: 0xdb2777,
  RS: 0x7c3aed, RO: 0x047857, RR: 0x0d9488, SC: 0x0369a1,
  SP: 0xb91c1c, SE: 0xc2410c, TO: 0x4d7c0f
};

const states = Object.keys(stateColors);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('container').appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 7);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

const stateMeshes = {};
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

states.forEach((uf, i) => {
  const geo = new THREE.BoxGeometry(1.2, 0.4, 1.2);
  const mat = new THREE.MeshLambertMaterial({ color: stateColors[uf] });
  const mesh = new THREE.Mesh(geo, mat);
  const col = i % 6;
  const row = Math.floor(i / 6);
  mesh.position.set((col - 2.5) * 2.2, 0, (row - 2) * 2.2);
  mesh.userData = { uf };
  scene.add(mesh);
  stateMeshes[uf] = mesh;

  const div = document.createElement('div');
  div.className = 'state-label';
  div.textContent = uf;
  div.style.display = 'none';
  document.body.appendChild(div);
  mesh.userData.label = div;
});

function updateLabels() {
  Object.values(stateMeshes).forEach(mesh => {
    const vector = mesh.position.clone().project(camera);
    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
    const label = mesh.userData.label;
    label.style.left = x + 'px';
    label.style.top = y + 'px';
    label.style.display = 'block';
  });
}

function animate() {
  requestAnimationFrame(animate);
  updateLabels();
  renderer.render(scene, camera);
}
animate();

const sun = document.getElementById('sun');
document.addEventListener('mousemove', e => {
  sun.style.left = e.clientX + 'px';
  sun.style.top = e.clientY + 'px';
});

const buttonsEl = document.getElementById('buttons');
let selectedUF = null;

renderer.domElement.addEventListener('click', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(Object.values(stateMeshes));
  if (intersects.length) {
    selectedUF = intersects[0].object.userData.uf;
    buttonsEl.style.display = 'flex';
    buttonsEl.style.left = e.clientX + 'px';
    buttonsEl.style.top = e.clientY + 'px';
  }
});

document.addEventListener('click', e => {
  if (!buttonsEl.contains(e.target) && e.target !== renderer.domElement) {
    buttonsEl.style.display = 'none';
  }
});

document.querySelectorAll('#buttons .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.key;
    const url = links[key];
    if (url) window.open(url, '_blank');
    else alert('Link ainda não definido no admin para: ' + key);
    buttonsEl.style.display = 'none';
  });
});

document.getElementById('darkBtn').addEventListener('click', () => {
  document.body.classList.toggle('light');
});

const admin = document.getElementById('admin');
document.getElementById('lock').addEventListener('click', () => {
  document.getElementById('link-saude').value = links.saude || '';
  document.getElementById('link-eletronica').value = links.eletronica || '';
  document.getElementById('link-ti').value = links.ti || '';
  admin.style.display = 'block';
});
document.getElementById('closeAdmin').addEventListener('click', () => admin.style.display = 'none');
document.getElementById('saveLinks').addEventListener('click', () => {
  links.saude = document.getElementById('link-saude').value;
  links.eletronica = document.getElementById('link-eletronica').value;
  links.ti = document.getElementById('link-ti').value;
  localStorage.setItem('bgd-links', JSON.stringify(links));
  alert('Links salvos!');
  admin.style.display = 'none';
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
